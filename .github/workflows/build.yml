name: Build & release

# La fiecare push pe main: verificare tipuri, build Next.js (standalone) și publicare
# în ramura `release`, de unde cron-ul de pe cPanel îl preia (scripts/cpanel-deploy.sh).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Pregătește pachetul
        run: |
          mkdir -p release/.next
          cp -r .next/standalone/. release/
          cp -r .next/static release/.next/static
          cp -r public release/public
          cp -r sql scripts release/
          rm -f release/.env

      - name: Publică în ramura release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cd release
          git init -q -b release
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A -f
          git commit -q -m "build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" release
