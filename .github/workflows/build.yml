name: Build & publicare

# La fiecare push pe main: verificare tipuri, build Next.js (standalone), apoi publicare:
#   1. build-ul se strânge într-o arhivă și se urcă prin FTP în .deploy/ (un singur fișier, rapid);
#   2. cron-ul din cPanel (la fiecare minut, scripts/cpanel-unpack.sh) o despachetează și repornește aplicația;
#   3. aplicația aplică singură migrările SQL noi la pornire (src/instrumentation.ts); GitHub verifică /api/health.
#
# Secrets necesare (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER     ex: ftp.domeniu.ro
#   FTP_USERNAME   contul FTP (cu folderul aplicației ca rădăcină)
#   FTP_PASSWORD
#   FTP_DIR        opțional: folderul aplicației față de rădăcina contului FTP (ex: constructiidevize/)
#   SITE_URL       ex: https://devizconstruct.ro
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Publicarea rulează doar pe main și doar după ce secretele FTP sunt configurate.
      DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Pregătește arhiva
        run: |
          mkdir -p release/.next
          cp -r .next/standalone/. release/
          cp -r .next/static release/.next/static
          cp -r public release/public
          cp -r sql scripts release/
          rm -f release/.env
          echo "${GITHUB_SHA}" > release/BUILD_SHA
          (cd release && zip -qr -9 ../deploy.zip .)
          ls -lh deploy.zip

      - name: Urcă arhiva prin FTP
        if: env.DEPLOY == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          base="ftp://${FTP_SERVER}/${FTP_DIR}"
          base="${base%/}/.deploy/"
          up() {
            # FTPS obligatoriu; dacă certificatul serverului nu se potrivește cu numele, reîncercăm fără verificarea lui.
            curl -sS --ssl-reqd --ftp-create-dirs --user "${FTP_USERNAME}:${FTP_PASSWORD}" "$@" \
              || curl -sS --ssl-reqd --insecure --ftp-create-dirs --user "${FTP_USERNAME}:${FTP_PASSWORD}" "$@"
          }
          up -T scripts/cpanel-unpack.sh "${base}unpack.sh"
          # Arhiva se urcă sub alt nume și se redenumește la final, ca cron-ul să nu prindă un fișier pe jumătate.
          up -T deploy.zip "${base}deploy.zip.part" -Q "-RNFR deploy.zip.part" -Q "-RNTO deploy.zip"
          echo "Arhiva a fost urcată."

      - name: Așteaptă noua versiune pe site
        if: env.DEPLOY == 'true'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          # Cron-ul rulează la fiecare minut; așteptăm până la ~5 minute.
          for i in $(seq 1 30); do
            health=$(curl -s -m 15 "${SITE_URL}/api/health" || true)
            build=$(echo "$health" | sed -n 's/.*"build":"\([^"]*\)".*/\1/p')
            if [ "$build" = "${GITHUB_SHA}" ]; then echo "Site-ul rulează versiunea nouă: $health"; exit 0; fi
            sleep 10
          done
          echo "Site-ul nu a preluat versiunea nouă în 5 minute. Verifică cron-ul din cPanel (unpack.sh) și jurnalul ~/constructiidevize-deploy.log."
          exit 1
