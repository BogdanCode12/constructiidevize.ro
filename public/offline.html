<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Fără conexiune · DevizConstruct.ro</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#0c0c0d;font-family:Inter,Helvetica,Arial,sans-serif;padding:24px;box-sizing:border-box}
  main{max-width:440px;text-align:center}
  img{width:190px;height:auto;margin-bottom:36px}
  h1{font-size:24px;letter-spacing:-.02em;margin:0 0 10px}
  p{color:#5c5c63;line-height:1.6;margin:0 0 26px}
  button{background:#c71319;color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{background:#a50f14}
</style>
</head>
<body>
<main>
  <img src="/brand/devizconstruct-logo.png" alt="DevizConstruct.ro">
  <h1>Nu ai conexiune la internet</h1>
  <p>DevizConstruct.ro are nevoie de internet ca să-ți încarce devizele și documentele. Modificările deja salvate sunt în siguranță. Verifică conexiunea și încearcă din nou.</p>
  <button onclick="location.reload()">Încearcă din nou</button>
</main>
<script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
